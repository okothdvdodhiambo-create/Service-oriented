services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  document-registry:
    build:
      context: .
      dockerfile: services/document-registry-service/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/registry?schema=public
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?Set INTERNAL_EVENT_SECRET}
      VERIFICATION_SERVICE_URL: http://verification:3000
      DEMO_INSTITUTION_API_KEY: ${DEMO_INSTITUTION_API_KEY:?Set DEMO_INSTITUTION_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  verification:
    build:
      context: .
      dockerfile: services/verification-service/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/verification?schema=public
      DOCUMENT_REGISTRY_URL: http://document-registry:3000
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET}
      SERVER_PEPPER: ${SERVER_PEPPER:?Set SERVER_PEPPER}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      INTERNAL_EVENT_SECRET: ${INTERNAL_EVENT_SECRET:?Set INTERNAL_EVENT_SECRET}
      TRUST_PROXY_HOPS: "1"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      DEMO_INSTITUTION_API_KEY: ${DEMO_INSTITUTION_API_KEY:?Set DEMO_INSTITUTION_API_KEY}
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:?Set DEMO_LOGIN_EMAIL}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Set DEMO_LOGIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      document-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/verification?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TRUST_PROXY_HOPS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      verification:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      PORT: 8080
      VERIFICATION_SERVICE_URL: http://verification:3000
      AUTH_SERVICE_URL: http://auth:3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TRUST_PROXY_HOPS: "0"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    depends_on:
      verification:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - gateway
    ports:
      - "5173:80"

  employer-hr:
    build:
      context: demo-clients/employer-hr
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - gateway
    ports:
      - "5174:80"

volumes:
  postgres-data:
